name: Deploy MultiDocker
on:
  push:
    branches:
      - main # check your repo, your default branch might be master!

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ivanlow/react-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true ivanlow/react-test npm test

  build-push-hub:
     runs-on: ubuntu-latest
     needs: test
     steps:
      - uses: actions/checkout@v4
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - run: docker build -t ivanlow/multi-client ./client
      - run: docker build -t ivanlow/multi-nginx ./nginx
      - run: docker build -t ivanlow/multi-server ./server
      - run: docker build -t ivanlow/multi-worker ./worker

      - run: docker push ivanlow/multi-client
      - run: docker push ivanlow/multi-nginx
      - run: docker push ivanlow/multi-server
      - run: docker push ivanlow/multi-worker

  deploy:
      runs-on: ubuntu-latest
      needs: build-push-hub
      steps:
      - uses: actions/checkout@v4
      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v18
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          existing_bucket_name: elasticbeanstalk-ap-southeast-2-019446560465
          region: ap-southeast-2
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
